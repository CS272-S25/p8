<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart | Trendora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light mb-4">
    <div class="container">
      <a class="navbar-brand text-tan fw-bold" href="index.html">Trendora</a>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-tan" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="mens.html">Men's</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="womens.html">Women's</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="footwear.html">Footwear</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="accessories.html">Accessories</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="eco-friendly.html">Eco-Friendly</a></li>
          <a class="nav-link text-tan" href="about-us.html">About Us</a>
          <li class="nav-item"><a class="nav-link text-tan" href="cart.html">Cart</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Cart -->
  <div class="container">
    <h1 class="text-center text-tan mb-4">Shopping Cart</h1>
    <div id="cart-items" class="mb-4"></div>
    <h3 id="cart-total" class="text-end mb-3"></h3>
<div class="text-end">
  <button class="btn btn-outline-danger me-2" onclick="clearCart()">Clear Cart</button>
  <button class="btn btn-success" onclick="alert('This would take you to checkout.')">Check Out</button>
</div>

  </div>

  <script>
    function loadCart() {
      const cartItems= JSON.parse(localStorage.getItem('cart')) || [];
      if (cartItems.length=== 0) {
        document.getElementById("cart-items").innerHTML= "<p>Your cart is empty</p>";
        document.getElementById("cart-total").textContent= "";
        return;
      }

      fetch("data/products.json")
        .then(res => res.json())
        .then(products => {
          let html= "";
          let total= 0;
          cartItems.forEach(item => {
            const product = products.find(p=> p.id=== item.id);
            if(!product)return;

            const subtotal=product.price*item.qty;
            total += subtotal;

            html += `
              <div class="card mb-3 p-3">
                <div class="row align-items-center">
                  <div class="col-md-2">
                    <img src="${product.image}" class="img-fluid" alt="${product.name}">
                  </div>
                  <div class="col-md-6">
                    <h5>${product.name}</h5>
                    <p>$${product.price.toFixed(2)}x${item.qty}=$${subtotal.toFixed(2)}</p>
                  </div>
                  <div class="col-md-4 text-end">
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${item.id}, -1)">-</button>
                    <span class="mx-2">${item.qty}</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${item.id}, 1)">+</button>
                    <button class="btn btn-sm btn-outline-danger ms-3" onclick="removeItem(${item.id})">Remove</button>
                  </div>
                </div>
              </div>
            `;
          });

          document.getElementById("cart-items").innerHTML = html;
          document.getElementById("cart-total").textContent = "Total: $" + total.toFixed(2);
        });
    }

    function updateQty(id,change) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const index = cart.findIndex(item => item.id === id);
      if (index!== -1) {
        cart[index].qty += change;
        if (cart[index].qty <= 0) cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
      }
    }

    function removeItem(id) {
      let cart =JSON.parse(localStorage.getItem('cart')) || [];
      cart = cart.filter(item => item.id !== id);
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
    }
    function clearCart() {
      localStorage.removeItem('cart');
      loadCart();
    }
    loadCart();
  </script>

</body>
</html>
