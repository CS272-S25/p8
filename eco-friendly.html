<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trendora | Eco-Friendly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light mb-4">
    <div class="container">
      <a class="navbar-brand text-tan fw-bold" href="index.html">Trendora</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-tan" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="mens.html">Men's</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="womens.html">Women's</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="footwear.html">Footwear</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="accessories.html">Accessories</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="eco-friendly.html">Eco-Friendly</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="about-us.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link text-tan" href="cart.html">Cart</a></li>
        </ul>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Eco friendly -->
  <div class="container">
    <h1 class="text-center text-tan mb-5">Eco-Friendly Products</h1>
    <div class="row g-4" id="product-container"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch('data/products.json')
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById("product-container");
        const eco = products.filter(p => p.category === "eco");

        container.innerHTML = eco.map(p => `
          <div class="col-md-4">
            <a href="product.html?id=${p.id}" class="text-decoration-none text-dark">
              <div class="card p-3 text-center">
                <img src="${p.image}" class="card-img-top" alt="${p.name}">
                <h5 class="mt-3">${p.name}</h5>
                <p>$${p.price.toFixed(2)}</p>
              </div>
            </a>
          </div>
        `).join('');
      })
      .catch(err => {
        document.getElementById("product-container").innerHTML = "<p class='text-danger'>Failed to load products.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
