<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trendora | Product Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light mb-4">
  <div class="container">
    <a class="navbar-brand text-tan fw-bold" href="index.html">Trendora</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link text-tan" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link text-tan" href="mens.html">Men's</a></li>
        <li class="nav-item"><a class="nav-link text-tan" href="womens.html">Women's</a></li>
        <li class="nav-item"><a class="nav-link text-tan" href="footwear.html">Footwear</a></li>
        <li class="nav-item"><a class="nav-link text-tan" href="accessories.html">Accessories</a></li>
        <li class="nav-item"><a class="nav-link text-tan" href="eco-friendly.html">Eco-Friendly</a></li>
        <li class="nav-item"><a class="nav-link text-tan" href="about-us.html">About Us</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Product Details -->
<div class="container">
  <div class="row g-4">
    <div class="col-md-6">
      <img id="product-image" src="" alt="Product Image" class="img-fluid rounded shadow">
    </div>
    <div class="col-md-6">
      <h2 id="product-name" class="text-tan mb-3">Loading...</h2>
      <h4 id="product-price" class="text-muted mb-3">$0.00</h4>
      <p id="product-desc" class="mb-4">Loading description...</p>
      <button class="btn btn-primary" id="add-to-cart">Add to Cart</button>
      <div id="cart-alert" class="alert alert-success mt-3 d-none">Added to cart!</div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  let productData;
  fetch('data/products.json')
    .then(res => res.json())
    .then(data => {
      const id = new URLSearchParams(location.search).get("id");
      const product = data.find(p => p.id == id);
      productData = product;
      if (product) {
        document.getElementById("product-name").textContent = product.name;
        document.getElementById("product-image").src = product.image;
        document.getElementById("product-price").textContent = `$${product.price}`;
        document.getElementById("product-desc").textContent = product.description;
      }
    });

  document.getElementById("add-to-cart").addEventListener("click", () => {
    if (productData) {
      addToCart(productData.id, productData.name, productData.price);
    }
  });
</script>
</body>
</html>
